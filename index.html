<!doctype html>
<!-- The interface is written in English; only the hut names are German. A
     screen reader set to de-AT reads "Bookable online" as German, which is
     unintelligible. og:locale below is a separate thing and stays. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hüttenfinder — Austrian alpine huts with free beds</title>
    <!-- The site's name for search results, and who publishes it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.hutfinder.at/#website",
            "name": "Hüttenfinder",
            "alternateName": "hutfinder.at",
            "url": "https://www.hutfinder.at/",
            "inLanguage": ["en", "de", "nl", "fr", "cs"],
            "publisher": { "@id": "https://www.hutfinder.at/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.hutfinder.at/#organization",
            "name": "Hüttenfinder",
            "url": "https://www.hutfinder.at/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.hutfinder.at/logo-512.png",
              "width": 512,
              "height": 512
            }
          }
        ]
      }
    </script>
    <meta
      name="description"
      content="Find and book mountain huts in Austria for your next hiking trip. Search 1,524 huts by live bed availability, region and room type, then book direct."
    />

    <!-- Chocolate browser chrome on Android, and on iOS when saved to the home screen -->
    <meta name="theme-color" content="#3A2A20" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://www.hutfinder.at/" />

    <!-- What shows when the link is pasted into WhatsApp, Slack, Signal, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hutfinder.at/" />
    <meta property="og:title" content="Hüttenfinder — Austrian alpine huts with free beds" />
    <meta
      property="og:description"
      content="Every hut in Austria, with the beds still free. Search 1,524 alpine huts by live bed availability."
    />
    <meta property="og:image" content="https://www.hutfinder.at/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="de_AT" />
    <meta property="og:site_name" content="Hüttenfinder" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hüttenfinder — Austrian alpine huts with free beds" />
    <meta
      name="twitter:description"
      content="Every hut in Austria, with the beds still free."
    />
    <meta name="twitter:image" content="https://www.hutfinder.at/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
