name: Refresh hut availability

on:
  schedule:
    # 5 times a day (UTC), clustered around European daytime so the freshest
    # data lands when people browse. Adjust these times to taste.
    - cron: "0 4,9,13,17,21 * * *"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

# allow the job to push the updated snapshot back to the repo
permissions:
  contents: write
  actions: write

# don't let two refreshes overlap
concurrency:
  group: availability-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch availability snapshot
        run: python scripts/fetch_availability.py

      - name: Commit snapshot if it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "availability-bot"
          git config user.email "availability-bot@users.noreply.github.com"
          git add public/availability.json
          if git diff --staged --quiet; then
            echo "No availability changes."
          else
            git commit -m "Refresh availability snapshot [skip ci]"
            git pull --rebase
            git push
            gh workflow run deploy.yml --ref main
          fi