name: diag hrs cert
on:
  push:
    branches: [diag/hrs-cert]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: diag-branch }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: live check
        run: python diag-branch/diag/live2.py
